name: Extended Android bootstrap

on:
  push:
    branches:
      - extended/bootstrap-android
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openyamm-extended-android
  cancel-in-progress: true

jobs:
  android:
    name: Build OpenYAMM Extended Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      OPENYAMM_ANDROID_VERSION_NAME: 0.1.1-bootstrap
      OPENYAMM_ANDROID_VERSION_CODE: 102

    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /CMakeLists.txt
            /LICENSE
            /COPYRIGHT
            /settings.ini
            /cmake/
            /engine/
            /game/
            /android/
            /packaging/licenses/
            /tools/openyamm_shaderc_stubs.cpp
            /tools/cook_sprite_atlases_main.cpp
            /tools/SpriteAtlasEncode.cpp
            /tools/SpriteAtlasEncode.h
            /tools/cook_sprite_atlases.py
            /tools/package_runtime_assets.py
            /tools/verify_extended_apk.py
            /tests/test_extended_apk.py
            /assets_cooked/android/sprites_new/
            /assets_dev/_legacy/sprites_original/
            /assets_dev/engine/
            /assets_dev/worlds/mm6/
            /assets_dev/worlds/mm7/
            /assets_dev/worlds/mm8/
            /assets_dev/worlds/mmmerge/

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/gradle.properties
            android/app/*.gradle

      - name: Cache bootstrap debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: openyamm-extended-bootstrap-debug-keystore-v1

      - name: Test APK content validation
        run: python3 tests/test_extended_apk.py

      - name: Cache official release baseline
        uses: actions/cache@v4
        with:
          path: build/extended-bootstrap/OpenYAMM-1.0-android-arm64.apk
          key: openyamm-official-1.0-76938005894690ff636be14677b4b0eb9f6f29e91e7237ce4d9bfc36b3662b47

      - name: Fetch and verify official 1.0 baseline
        run: |
          git fetch --filter=blob:none https://github.com/pjasicek/openyamm.git tag 1.0
          baseline="build/extended-bootstrap/OpenYAMM-1.0-android-arm64.apk"
          if [[ ! -s "$baseline" ]]; then
            mkdir -p build/extended-bootstrap
            curl --fail --location --retry 3 --output "$baseline" \
              'https://cloud.jasicek.net/s/7jyKBnEMDSJRSSp/download?path=%2Freleases%2F1.0%2F37285202150-1&files=OpenYAMM-1.0-android-arm64.apk'
          fi
          echo "76938005894690ff636be14677b4b0eb9f6f29e91e7237ce4d9bfc36b3662b47  $baseline" | sha256sum --check

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build libgl1-mesa-dev libx11-dev libxext-dev

      - name: Configure host tools
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOPENYAMM_BUILD_DESKTOP_EXECUTABLE=OFF
          -DOPENYAMM_BUILD_TESTS=OFF
          -DOPENYAMM_BUILD_EDITOR=OFF
          -DOPENYAMM_BUILD_TOOLS=OFF
          -DSDL_ALSA=OFF
          -DSDL_JACK=OFF
          -DSDL_KMSDRM=OFF
          -DSDL_PIPEWIRE=OFF
          -DSDL_PULSEAUDIO=OFF
          -DSDL_SNDIO=OFF
          -DSDL_UNIX_CONSOLE_BUILD=ON
          -DSDL_WAYLAND=OFF
          -DSDL_X11=OFF

      - name: Build host shader compiler and sprite cooker
        run: |
          cmake --build build --target openyamm_shaderc --parallel 4
          cmake --build build --target openyamm_sprite_atlas_cook --parallel 4

      - name: Repack Android runtime assets
        run: android/repack_runtime_assets.sh

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          android/gradlew :app:assembleDebug

      - name: Prepare artifact
        run: |
          source_apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$source_apk"
          mkdir -p dist
          cp "$source_apk" dist/OpenYAMM-Extended-bootstrap-android-arm64.apk
          sha256sum dist/OpenYAMM-Extended-bootstrap-android-arm64.apk > dist/OpenYAMM-Extended-bootstrap-android-arm64.apk.sha256
          ls -lh dist/

      - name: Verify APK identity, signature and runtime assets
        run: |
          apk="dist/OpenYAMM-Extended-bootstrap-android-arm64.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          python3 tools/verify_extended_apk.py "$apk" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --baseline-apk build/extended-bootstrap/OpenYAMM-1.0-android-arm64.apk \
            --report dist/extended-apk-verification.json

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: openyamm-extended-bootstrap-android
          path: |
            dist/OpenYAMM-Extended-bootstrap-android-arm64.apk
            dist/OpenYAMM-Extended-bootstrap-android-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload verification report
        uses: actions/upload-artifact@v7
        with:
          name: openyamm-extended-bootstrap-verification
          path: |
            dist/extended-apk-verification.json
            dist/OpenYAMM-Extended-bootstrap-android-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 7
