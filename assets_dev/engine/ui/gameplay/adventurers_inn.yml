# Carved Obsidian guild; see level_generation/ui/obsidian_adventurers_guild_20260929/README.md
screen: Character

elements:
  - id: AdventurersInnRoot
    anchor: center
    width: 640
    height: 480
    scale:
      min: 1.0
      max: 8.0
    z_index: 110
    notes: Adventurer's Inn overlay layered on top of the standard character screen.
    children:
      - id: AdventurersInnBackground
        anchor: top_left
        offset_x: 0
        offset_y: 24
        width: 460
        height: 344
        z_index: 110
        asset:
          default: obsidian_guild_panel

      - id: AdventurersInnDetailsPanel
        anchor: top_left
        offset_x: 186
        offset_y: 44
        width: 258
        height: 300
        z_index: 115
        notes: Calm reading surface; character stats and biography retain their native layout and SMALLNUM font.

      - id: AdventurersInnScrollUpButton
        anchor: top_left
        offset_x: 8
        offset_y: 45
        width: 17
        height: 17
        z_index: 300
        interactive: true
        asset:
          default: obsidian_guild_up_normal
          highlighted: obsidian_guild_up_hover
          pressed: obsidian_guild_up_pressed
          disabled: obsidian_guild_up_disabled

      - id: AdventurersInnScrollDownButton
        anchor: top_left
        offset_x: 8
        offset_y: 326
        width: 17
        height: 17
        z_index: 300
        interactive: true
        asset:
          default: obsidian_guild_down_normal
          highlighted: obsidian_guild_down_hover
          pressed: obsidian_guild_down_pressed
          disabled: obsidian_guild_down_disabled

      - id: AdventurersInnHireButton
        anchor: top_left
        offset_x: 525
        offset_y: 380
        width: 75
        height: 26
        z_index: 300
        interactive: true
        asset:
          default: obsidian_button_tab_normal
          highlighted: obsidian_button_tab_hover
          pressed: obsidian_button_tab_pressed
          disabled: obsidian_button_tab_disabled
        text:
          value: Hire
          font: Fondamento
          color: '#e8d1a4'
          align_x: center
          align_y: middle
          scale: 0.416667

      - id: AdventurersInnExitButton
        anchor: top_left
        offset_x: 525
        offset_y: 450
        width: 75
        height: 26
        z_index: 300
        interactive: true
        asset:
          default: obsidian_button_tab_normal
          highlighted: obsidian_button_tab_hover
          pressed: obsidian_button_tab_pressed
        text:
          value: Exit
          font: Fondamento
          color: '#e8d1a4'
          align_x: center
          align_y: middle
          scale: 0.416667

      - id: AdventurersInnDollDividerBar
        anchor: top_left
        offset_x: 460
        offset_y: 24
        width: 8
        height: 347
        bottom_to: OutdoorBasebar
        z_index: 110
        asset:
          default: obsidian_left_edge
