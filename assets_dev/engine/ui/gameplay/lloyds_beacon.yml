  - id: LloydsBeaconRecallBeacon
    anchor: top_left
    offset_x: 510
    offset_y: 38
    width: 100
    height: 36
    z_index: 30
    interactive: true
    asset:
      default: obsidian_button_tab_normal
      highlighted: obsidian_button_tab_hover
      pressed: obsidian_button_tab_pressed
      selected: obsidian_button_tab_selected
    text:
      value: Recall
      font: Fondamento
      color: '#e8d1a4'
      align_x: center
      align_y: middle
      scale: 0.41666665625
  - id: LloydsBeaconSetBeacon
    anchor: top_left
    offset_x: 510
