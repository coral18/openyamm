  - id: LloydsBeaconSlot4
    anchor: top_left
    offset_x: 335
    offset_y: 330
    width: 120
    height: 90
    z_index: 20
    interactive: true
    asset:
      default: ''
      highlighted: ''
      pressed: ''
  - id: LloydsBeaconSlot5
    anchor: top_left
    offset_x: 225
    offset_y: 220
    width: 120
    height: 90
    z_index: 20
    interactive: true
    asset:
      default: ''
