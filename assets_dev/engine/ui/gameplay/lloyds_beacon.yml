# Carved Obsidian; original five beacon preview/hit rectangles are preserved.
screen: LloydsBeacon
elements:
- id: LloydsBeaconRoot
  anchor: center
  width: 640
  height: 480
  z_index: 440
  visible: true
  scale:
    min: 1.0
    max: 8.0
  children:
  - id: LloydsBeaconBackground
    anchor: top_left
    offset_x: 0
    offset_y: 0
    width: 640
    height: 480
    z_index: 0
    asset:
      default: obsidian_reading_surface
  - id: LloydsBeaconSetModeText
    anchor: top_left
    offset_x: 66
    offset_y: 34
    width: 414
    height: 36
    z_index: 20
    text:
      value: Set Beacon
      font: Book2
      align_x: center
      align_y: middle
      scale: 1.0
      color: '#e4c793'
  - id: LloydsBeaconRecallModeText
    anchor: top_left
    offset_x: 66
    offset_y: 34
    width: 414
    height: 36
    z_index: 20
    text:
      value: Recall Beacon
      font: Book2
      align_x: center
      align_y: middle
      scale: 1.0
      color: '#e4c793'
  - id: LloydsBeaconSlot1
    anchor: top_left
    offset_x: 115
    offset_y: 110
    width: 120
    height: 90
    z_index: 20
    interactive: true
    asset:
      default: ''
      highlighted: ''
      pressed: ''
  - id: LloydsBeaconSlot2
