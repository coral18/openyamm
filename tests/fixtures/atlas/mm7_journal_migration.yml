id: atlas.mm7_legacy_well_journal
title: Legacy map note migration survives leaving the discovery map and reload
world: mm7
mode: faithful
steps:
- load_game:
    name: legacy-known
    path: saves/legacy-known.oysav
- assert:
    runtime_event_variable:
      id: 17170657
      value: 1
    named_global_var_changed:
      name: openyamm.migration.journal-notes-v1
      value: 1
- load_map:
    map: out14.odm
- assert:
    runtime_event_variable:
      id: 17170657
      value: 1
- save_game: journal-migrated
- load_game: journal-migrated
- assert:
    runtime_event_variable:
      id: 17170657
      value: 1
