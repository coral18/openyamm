id: atlas.mm7_site_observation_privacy
title: Guide and Discovery browsing neither invent nor modify actual site outcomes
world: mm7
mode: faithful
steps:
- load_game:
    name: before-known
    path: saves/before-known.oysav
- assert:
    runtime_event_variable:
      id: 21
      value: 200
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/seen
      value: 1
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/changed
      value: 0
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/stat/Gold/seen
      value: 1
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/stat/Gold/min-before
      value: 0
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/stat/Gold/min-after
      value: 200
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/stat/Gold/max-after
      value: 200
- load_game:
    name: after-known
    path: saves/after-known.oysav
- assert:
    runtime_event_variable:
      id: 21
      value: 200
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/seen
      value: 1
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/changed
      value: 0
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/stat/Gold/seen
      value: 1
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/stat/Gold/min-before
      value: 0
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/stat/Gold/min-after
      value: 200
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/stat/Gold/max-after
      value: 200
- save_game: privacy-roundtrip-known
- load_game: privacy-roundtrip-known
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/seen
      value: 1
- load_game:
    name: before-unseen
    path: saves/before-unseen.oysav
- assert:
    runtime_event_variable:
      id: 21
      value: 0
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/seen
      value: 0
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/changed
      value: 0
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/stat/Gold/seen
      value: 0
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/stat/Gold/min-before
      value: 0
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/stat/Gold/min-after
      value: 0
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/stat/Gold/max-after
      value: 0
- load_game:
    name: after-unseen
    path: saves/after-unseen.oysav
- assert:
    runtime_event_variable:
      id: 21
      value: 0
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/seen
      value: 0
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/changed
      value: 0
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/stat/Gold/seen
      value: 0
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/stat/Gold/min-before
      value: 0
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/stat/Gold/min-after
      value: 0
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/stat/Gold/max-after
      value: 0
- save_game: privacy-roundtrip-unseen
- load_game: privacy-roundtrip-unseen
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/38/surface/10/event/223/seen
      value: 0
