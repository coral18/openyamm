id: atlas.mm8_scripted_spawn_privacy
title: Guide spawn references preserve actual campaign use flags and source discoveries
world: mm8
mode: faithful
steps:
- load_game:
    name: before
    path: saves/before.oysav
- &id001
  assert:
    map: d05.blv
- &id002
  assert:
    qbit_clear:
    - 403
- &id003
  assert:
    map_var_changed:
      index: 21
      value: 0
- &id004
  assert:
    map_var_changed:
      index: 22
      value: 0
- &id005
  assert:
    map_var_changed:
      index: 23
      value: 0
- &id006
  assert:
    named_map_var_changed:
      name: openyamm.discovery.chest/19/time
      value: 540
- load_game:
    name: quicksave
    path: saves/quicksave.oysav
- *id001
- *id002
- *id003
- *id004
- *id005
- *id006
- assert:
    inventory:
    - item_id: 630
- save_game: scripted-reference-verified
- load_game: scripted-reference-verified
- *id001
- *id002
- *id003
- *id004
- *id005
- *id006
- assert:
    inventory:
    - item_id: 630
