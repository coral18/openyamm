id: atlas.mm8_shared_house_visit
title: An actual secondary Inn visit retains its physical discovery through Atlas browsing and save/load
world: mm8
mode: faithful
steps:
- load_game: {name: before, path: saves/before.oysav}
- assert: {named_global_var_changed: {name: openyamm.discovery.house/1607, value: 0}}
- load_game: {name: quicksave, path: saves/quicksave.oysav}
- &map
  assert: {map: out01.odm, gold: 5000, food: 10}
- &house
  assert: {named_global_var_changed: {name: openyamm.discovery.house/1607, value: 1}}
- &site
  assert:
    named_map_var_changed: {name: openyamm.discovery.site/bmodel/64/surface/6/event/199, value: 1}
- save_game: shared-house-verified
- load_game: shared-house-verified
- *map
- *house
- *site
