id: atlas.mm7_barrow_b_verify
title: Native conditional route observations survive roundtrip without inventing the
  alternative journey
world: mm7
mode: faithful
steps:
- load_game:
    name: native
    path: saves/quicksave.oysav
- &id001
  assert:
    map: mdr01.blv
- &id002
  assert:
    named_map_var_changed:
      name: openyamm.discovery.arrival/world.mm7.map.mdk01/event/502/seen
      value: 1
- &id003
  assert:
    named_map_var_changed:
      name: openyamm.discovery.arrival/mdk01.blv/event/502/seen
      value: 0
- &id004
  assert:
    runtime_event_variable:
      id: 21
      value: 500
- &id005
  assert:
    runtime_event_variable:
      id: 23
      value: 10
- &id006
  assert:
    runtime_event_variable:
      id: 5
      member_index: 0
      value: 21
- save_game: connection-roundtrip
- load_game: connection-roundtrip
- *id001
- *id002
- *id003
- *id004
- *id005
- *id006
- load_map:
    map: mdk01.blv
- assert:
    map: mdk01.blv
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site/surface/250/event/502
      value: 1
- assert:
    map_var_changed:
      index: 2
      value: 2
- load_map:
    map: mdt01.blv
- assert:
    map: mdt01.blv
- assert:
    named_map_var_changed:
      name: openyamm.discovery.arrival/world.mm7.map.mdk01/event/502/seen
      value: 0
