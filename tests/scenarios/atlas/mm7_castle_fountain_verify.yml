id: atlas.mm7_castle_fountain_native_verify
title: Fountain interaction survives save/load without duplicating face discovery
world: mm7
mode: faithful
steps:
- load_game:
    name: native
    path: saves/quicksave.oysav
- &id001
  assert:
    map: 7d29.blv
- &id002
  assert:
    qbit_set:
    - 718
- &id003
  assert:
    qbit_clear:
    - 610
- &id004
  assert:
    runtime_event_variable:
      id: 21
      value: 500
- &id005
  assert:
    runtime_event_variable:
      id: 23
      value: 10
- &id006
  assert:
    named_map_var_changed:
      name: openyamm.discovery.site/surface/1668/event/65031
      value: 1
- &id007
  assert:
    named_map_var_changed:
      name: openyamm.discovery.site/surface/1669/event/65031
      value: 0
- &id008
  assert:
    named_map_var_changed:
      name: openyamm.discovery.site/surface/1689/event/65031
      value: 0
- &id009
  assert:
    named_map_var_changed:
      name: openyamm.discovery.site/surface/1697/event/65031
      value: 0
- &id010
  assert:
    named_map_var_changed:
      name: openyamm.discovery.site/surface/4669/event/65031
      value: 0
- &id011
  assert:
    named_map_var_changed:
      name: openyamm.discovery.site/surface/4670/event/65031
      value: 0
- save_game: fountain-roundtrip
- load_game: fountain-roundtrip
- *id001
- *id002
- *id003
- *id004
- *id005
- *id006
- *id007
- *id008
- *id009
- *id010
- *id011
