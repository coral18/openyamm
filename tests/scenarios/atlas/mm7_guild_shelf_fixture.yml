    party:
      gold: 5000
      food: 10
      members:
      - name: Shelf Tester
        class: Knight
        level: 1
        experience: 0
        race_id: 0
        skills: []
        equipment: {}
- set_pose:
    x: -8500
    y: 15360
    z: 352
    yaw: 3.14159265
