id: atlas.mm7_low_native_drink
title: Native drink outcomes and Atlas browsing preserve per-site discovery and character
  state
world: mm7
mode: faithful
steps:
- load_game:
    name: before
    path: saves/before.oysav
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site/surface/2058/event/451
      value: 0
- assert:
    runtime_event_variable:
      id: 117
      value: 0
      member_index: 0
- load_game:
    name: native
    path: saves/quicksave.oysav
- &id001
  assert:
    named_map_var_changed:
      name: openyamm.discovery.site/surface/2058/event/451
      value: 1
- &id002
  assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/surface/2058/event/451/seen
      value: 1
- &id003
  assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/surface/2058/event/451/changed
      value: 0
- &id004
  assert:
    named_map_var_changed:
      name: openyamm.discovery.site/surface/2059/event/451
      value: 0
- &id005
  assert:
    runtime_event_variable:
      id: 117
      value: 1
      member_index: 0
- &id006
  assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/surface/2058/event/451/stat/Paralyzed/min-before
      value: 0
- &id007
  assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/surface/2058/event/451/stat/Paralyzed/max-after
      value: 1
- &id008
  assert:
    runtime_event_variable:
      id: 21
      value: 500
- &id009
  assert:
    runtime_event_variable:
      id: 23
      value: 10
- save_game: native-roundtrip
- load_game: native-roundtrip
- *id001
- *id002
- *id003
- *id004
- *id005
- *id006
- *id007
- *id008
- *id009
