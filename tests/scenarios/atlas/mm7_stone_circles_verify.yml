id: atlas.mm7_stone_circles_verify
title: Atlas browsing preserves all three stone circles and their completed group
world: mm7
mode: faithful
steps:
- load_game:
    path: saves/quicksave.oysav
- assert: &id001
    qbit_set:
    - 561
    - 562
    - 563
    - 564
    - 565
    qbit_clear:
    - 757
- save_game: roundtrip
- load_game: roundtrip
- assert: *id001
