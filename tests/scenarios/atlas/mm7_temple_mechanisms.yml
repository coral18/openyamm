id: atlas.mm7_temple_mechanisms
title: Use all three actual mechanisms before the temple altar
world: mm7
mode: faithful
steps:
- new_game_flow:
    start_map: t01.blv
    party:
      gold: 5000
      food: 10
      members:
      - name: Atlas Tester
        class: Knight
        level: 20
        race_id: 0
        skills: []
        equipment: {}
- set_pose: &id001
    x: -512
    y: 15104
    z: 0
    yaw: 1.5707963
    pitch: -1.45
- save_game: before
- press_interact:
