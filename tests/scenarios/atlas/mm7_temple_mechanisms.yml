      triggered_event: 4
      can_activate: true
- press_interact:
    pose: *id001
    expect:
      kind: event_target
      triggered_event: 12
      can_activate: true
- assert:
    map_var_changed:
      index: 2
      value: 1
- assert:
    map_var_changed:
      index: 3
      value: 0
- assert:
    map_var_changed:
      index: 4
      value: 0
- press_interact:
    pose:
      x: -2920
      y: 15008
      z: 640
