id: atlas.mm7_walking_boundary
world: mm7
mode: faithful
steps:
- new_game_flow: {start_map: 7out02.odm}
- movement_segment:
    input: forward
    duration_ms: 500
    start: {map: 7out02.odm, x: 0, y: 23100, z: 1951.25, yaw: 1.5707963, pitch: 0}
    expect_stop: {map: 7out02.odm, x: 0, y: 23106, z: 1947.875, yaw: 1.5707963, pitch: 0}
    tolerance_xy: 16
    tolerance_z: 16
    actor_ai: false
    actor_collision: false
- assert:
    map_transition_requested:
      source_kind: map_boundary
      source_id: 0
      destination_map: 7out04.odm
      confirmation_required: true
- select_topic: {kind: map_transition_confirm, action_id: 0}
- assert: {map: 7out04.odm}
