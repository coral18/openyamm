id: atlas.mm8_actor_npc_encounter
title: S'ton's actual actor encounter records a position while remote dialogue does not
world: mm8
mode: faithful
steps:
- new_game_flow:
    start_map: out01.odm
    party:
      gold: 5000
      food: 10
      members:
      - {name: Atlas Tester, class: Knight, level: 20, race_id: 0, skills: [], equipment: {}}
- save_game: unknown
- speak_npc: {source_id: 27}
- assert:
    named_global_var_changed:
      {name: openyamm.discovery.npc-actor.v1/27/world.mm8.map.out01/seen, value: 0}
- press_action: {action: cancel_dialog}
- save_game: remote-only
- press_interact:
    pose: {x: 3240, y: 7960, z: 544, yaw: 0, pitch: -0.4}
    expect: {kind: actor, actor_index: 0, can_activate: true}
- assert:
    named_global_var_changed:
      {name: openyamm.discovery.npc-actor.v1/27/world.mm8.map.out01/seen, value: 1}
- assert:
    named_global_var_changed:
      {name: openyamm.discovery.npc-actor.v1/27/world.mm8.map.out01/actor, value: 0}
- assert:
    named_global_var_changed:
      {name: openyamm.discovery.npc-actor.v1/27/world.mm8.map.out01/x, value: 3440}
- assert:
    named_global_var_changed:
      {name: openyamm.discovery.npc-actor.v1/27/world.mm8.map.out01/y, value: 7960}
- assert:
    named_global_var_changed:
      {name: openyamm.discovery.npc-actor.v1/27/world.mm8.map.out01/z, value: 544}
- assert: {named_global_var_changed: {name: openyamm.discovery.npc/27/house, value: 0}}
- press_action: {action: cancel_dialog}
- save_game: met
- load_map: {map: d05.blv}
- load_game: met
- assert:
    named_global_var_changed:
      {name: openyamm.discovery.npc-actor.v1/27/world.mm8.map.out01/seen, value: 1}
- assert:
    named_global_var_changed:
      {name: openyamm.discovery.npc-actor.v1/27/world.mm8.map.out01/x, value: 3440}
- assert:
    named_global_var_changed:
      {name: openyamm.discovery.npc-actor.v1/27/world.mm8.map.out01/z, value: 544}
- save_game: verified
tags: [mm7, atlas, npc, discovery, save]
