id: atlas.mm8_arrival
world: mm8
mode: faithful
title: Normal dungeon exit records its actual arrival and retains it through save/load
steps:
- new_game_flow:
    start_map: out01.odm
- load_map:
    map: d05.blv
- press_interact:
    pose:
      x: 12850
      y: 2432
      z: 384
      yaw: 3.1415927
    expect:
      kind: event_target
      triggered_event: 502
      can_activate: true
- select_topic:
    kind: map_transition_confirm
    action_id: 0
- assert:
    map: out01.odm
- assert:
    named_map_var_changed:
      name: openyamm.discovery.arrival/world.mm8.map.d05/event/502/seen
      value: 1
- assert:
    named_map_var_changed:
      name: openyamm.discovery.arrival/world.mm8.map.d05/event/502/x
      value: 21519
- save_game: arrival
- load_game: arrival
- assert:
    named_map_var_changed:
      name: openyamm.discovery.arrival/world.mm8.map.d05/event/502/seen
      value: 1
- assert:
    named_map_var_changed:
      name: openyamm.discovery.arrival/world.mm8.map.d05/event/502/x
      value: 21519
