id: atlas.mm8_gate_return_verify
title: Actual Ravenshore to Emerald Island travel retains canonical provenance and
  grouped fountain discovery
world: mm8
mode: faithful
steps:
- load_game:
    name: before
    path: saves/before.oysav
- &id007
  assert:
    map: out02.odm
- &id008
  assert:
    runtime_event_variable:
      id: 21
      value: 500
- &id009
  assert:
    runtime_event_variable:
      id: 23
      value: 10
- &id010
  assert:
    runtime_event_variable:
      id: 5
      member_index: 0
      value: 21
- load_game:
    name: native
    path: saves/quicksave.oysav
- &id001
  assert:
    map: 7out01.odm
- &id002
  assert:
    runtime_event_variable:
      id: 21
      value: 500
- &id003
  assert:
    runtime_event_variable:
      id: 23
      value: 10
- &id004
  assert:
    runtime_event_variable:
      id: 5
      member_index: 0
      value: 21
- &id005
  assert:
    named_map_var_changed:
      name: openyamm.discovery.arrival/world.mm8.map.out02/event/104/seen
      value: 1
- &id006
  assert:
    named_map_var_changed:
      name: openyamm.discovery.arrival/out02.odm/event/104/seen
      value: 0
- save_game: gate-roundtrip
- load_game: gate-roundtrip
- *id001
- *id002
- *id003
- *id004
- *id005
- *id006
- load_map:
    map: out02.odm
- *id007
- *id008
- *id009
- *id010
- assert:
    named_map_var_changed:
      name: openyamm.discovery.gate/104/merge.dimension_doors/TPGlobal:0/world.mm8.map.out01/seen
      value: 1
- assert:
    named_map_var_changed:
      name: openyamm.discovery.gate/104/merge.dimension_doors/TPGlobal:2/world.mm7.map.7out01/seen
      value: 1
- assert:
    named_map_var_changed:
      name: openyamm.discovery.gate/104/merge.dimension_doors/TPGlobal:4/world.mm6.map.oute3/seen
      value: 1
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site/bmodel/84/surface/31/event/104
      value: 1
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site/bmodel/83/surface/9/event/104
      value: 0
