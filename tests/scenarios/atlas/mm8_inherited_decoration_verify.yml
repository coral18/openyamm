id: atlas.mm8_native_decoration_persistence
title: Actual native sprite interaction and repeated use persist across save/load
world: mm8
mode: faithful
steps:
- load_game:
    name: before
    path: saves/before.oysav
- assert:
    runtime_event_variable:
      id: 32
      member_index: 0
      value: 15
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site/inherited-decoration/5/event/269
      value: 0
- load_game:
    name: native
    path: saves/quicksave.oysav
- &id001
  assert:
    runtime_event_variable:
      id: 32
      member_index: 0
      value: 17
- &id002
  assert:
    named_map_var_changed:
      name: openyamm.discovery.site/inherited-decoration/5/event/269
      value: 1
- &id003
  assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/inherited-decoration/5/event/269/seen
      value: 1
- &id004
  assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/inherited-decoration/5/event/269/stat/BaseMight/min-before
      value: 15
- &id005
  assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/inherited-decoration/5/event/269/stat/BaseMight/max-after
      value: 17
- &id006
  assert:
    named_map_var_changed:
      name: openyamm.discovery.site/inherited-decoration/5/event/268
      value: 1
- &id007
  assert:
    named_map_var_changed:
      name: openyamm.discovery.site/inherited-decoration/7/event/269
      value: 0
- save_game: native-roundtrip
- load_game: native-roundtrip
- *id001
- *id002
- *id003
- *id004
- *id005
- *id006
- *id007
- assert:
    runtime_event_variable:
      id: 21
      value: 500
- assert:
    runtime_event_variable:
      id: 23
      value: 10
