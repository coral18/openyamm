id: atlas.mm8_plain_drink
title: Real drinking interaction follows the active character requirements and survives
  save/load
world: mm8
mode: faithful
steps:
- new_game_flow:
    start_map: d20.blv
    party:
      gold: 500
      food: 10
      members:
      - name: Drink Tester
        class: Knight
        level: 1
        race_id: 0
        endurance: 15
        skills: []
        equipment: {}
- set_pose: &id001
    x: -1068
    y: 704
    z: 0
    yaw: 0
    pitch: -0.741
- save_game: before-drink
- assert:
    runtime_event_variable:
      id: 117
      member_index: 0
      value: 0
- press_interact:
    pose: *id001
    expect:
      kind: event_target
      triggered_event: 451
      can_activate: true
- &id002
  assert:
    runtime_event_variable:
      id: 117
      member_index: 0
      value: 0
- save_game: drink-used
- load_game: drink-used
- *id002
