id: atlas.mm8_flute_requirements_verify
title: Reading Guide routing requirements preserves campaign state and unvisited destinations
world: mm8
mode: faithful
steps:
- load_game:
    name: before
    path: saves/before.oysav
- assert:
    named_global_var_changed:
      name: openyamm.discovery.world.mm8.map.pbp
      value: 0
- assert:
    named_global_var_changed:
      name: openyamm.discovery.world.mm8.map.d50
      value: 0
- &id002
  assert:
    named_global_var_changed:
      name: openyamm.discovery.world.mm8.map.d31
      value: 0
- &id001
  assert:
    named_global_var_changed:
      name: openyamm.discovery.world.mm8.map.d33
      value: 0
- load_game:
    name: native
    path: saves/quicksave.oysav
- assert:
    named_global_var_changed:
      name: openyamm.discovery.world.mm8.map.pbp
      value: 0
- assert:
    named_global_var_changed:
      name: openyamm.discovery.world.mm8.map.d50
      value: 0
- *id001
- *id002
- &id003
  assert:
    map: d06.blv
- &id004
  assert:
    named_map_var_changed:
      name: openyamm.discovery.arrival/world.mm8.map.d34/event/451/seen
      value: 1
- &id005
  assert:
    named_map_var_changed:
      name: openyamm.discovery.arrival/d34.blv/event/451/seen
      value: 0
- &id006
  assert:
    runtime_event_variable:
      id: 21
      value: 500
- &id007
  assert:
    runtime_event_variable:
      id: 23
      value: 10
- &id008
  assert:
    runtime_event_variable:
      id: 5
      member_index: 0
      value: 21
- save_game: connection-roundtrip
- load_game: connection-roundtrip
- *id003
- *id004
- *id005
- *id006
- *id007
- *id008
- load_map:
    map: d34.blv
- assert:
    map: d34.blv
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site/surface/524/event/451
      value: 1
- assert:
    qbit_clear:
    - 214
