id: atlas.primary_house_address.fresh
title: A real shared Inn visit does not discover its unvisited primary address
world: mm8
mode: faithful
steps:
- new_game_flow:
    start_map: out01.odm
    party:
      gold: 5000
      food: 10
      members:
      - {name: Atlas Tester, class: Knight, level: 20, race_id: 0, skills: [], equipment: {}}
- press_interact:
    pose: {x: 13568, y: 9280, z: 960, yaw: 0, pitch: 0}
    expect: {kind: event_target, triggered_event: 199, can_activate: true}
- assert: {named_global_var_changed: {name: openyamm.discovery.house/1607, value: 1}}
- assert: {named_global_var_changed: {name: openyamm.discovery.house-address.v1/1607/seen, value: 1}}
- assert:
    named_global_var_changed:
      {name: openyamm.discovery.house-address.v1/1607/map/world.mm8.map.out01, value: 1}
- assert:
    named_global_var_changed:
      {name: openyamm.discovery.house-address.v1/1607/map/world.mm8.map.out02, value: 0}
- load_map: {map: out02.odm}
- save_game: before
- press_interact:
    pose: {x: 15424, y: -14500, z: 0, yaw: -1.57079632679, pitch: 0}
    expect: {kind: event_target, triggered_event: 209, can_activate: true}
- assert:
    named_global_var_changed:
      {name: openyamm.discovery.house-address.v1/1607/map/world.mm8.map.out02, value: 1}
- assert:
    named_global_var_changed:
      {name: openyamm.discovery.house-address.v1/1607/map/world.mm8.map.out01, value: 1}
- save_game: visited
- load_game: visited
- assert:
    named_global_var_changed:
      {name: openyamm.discovery.house-address.v1/1607/map/world.mm8.map.out02, value: 1}
