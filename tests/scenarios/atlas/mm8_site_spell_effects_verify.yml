id: atlas.mm8_site_spell_effects_verify
title: Atlas spell findings persist without awarding spells or changing resources
world: mm8
mode: faithful
steps:
- load_game:
    name: native
    path: saves/quicksave.oysav
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/22/surface/33/event/101/spell/party/38/actions
      value: 1
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/22/surface/33/event/101/spell/character/46/actions
      value: 1
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/22/surface/33/event/101/seen
      value: 1
- assert:
    map: out01.odm
    runtime_event_variable:
      id: 21
      value: 500
- save_game: spell-findings-roundtrip
- load_game: spell-findings-roundtrip
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/22/surface/33/event/101/spell/party/38/actions
      value: 1
- assert:
    named_map_var_changed:
      name: openyamm.discovery.site-effects.v1/bmodel/22/surface/33/event/101/spell/character/46/actions
      value: 1
