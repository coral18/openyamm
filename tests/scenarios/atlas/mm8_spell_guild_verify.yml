id: atlas.handoff_verify_mm8
title: Guide links preserve unvisited destinations through save/load
world: mm8
mode: faithful
steps:
- load_game:
    path: saves/quicksave.oysav
- &id001
  assert:
    map: out01.odm
- &id002
  assert:
    runtime_event_variable:
      id: 21
      value: 5000
- &id003
  assert:
    runtime_event_variable:
      id: 23
      value: 10
- &id004
  assert:
    named_global_var_changed:
      name: openyamm.discovery.world.mm8.map.out06
      value: 0
- &id005
  assert:
    named_global_var_changed:
      name: openyamm.discovery.house/175
      value: 0
- save_game: roundtrip
- load_game: roundtrip
- *id001
- *id002
- *id003
- *id004
- *id005
